<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Rozliczenie czynszu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: "Times New Roman", serif;
      background: #1a1a1a;
      color: #f5f5f5;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    h1 {
      font-size: 40px;
      color: #ff4d4d;
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 3px solid #ff4d4d;
      padding-bottom: 10px;
      animation: blink 1s infinite;
      letter-spacing: 2px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 30px;
      background: #262626;
      box-shadow: 0 0 15px rgba(0,0,0,0.7);
    }
    th, td {
      border: 1px solid #555;
      padding: 12px;
      text-align: center;
      word-break: break-word;
    }
    th {
      background: #333;
      color: #fff;
      font-size: 18px;
    }
    .paid {
      background: #204020;
      color: #cfc;
    }
    .unpaid {
      background: #401a1a;
      color: #ff9999;
      font-weight: bold;
      animation: blink 1s infinite;
    }
    .pending {
      background: #2a2a2a;
      color: #bbb;
    }
    @keyframes blink {
      50% { opacity: 0.5; }
    }
    footer {
      margin-top: auto;
      text-align: center;
      padding: 15px;
      font-size: 14px;
      color: #888;
      border-top: 1px solid #444;
    }
    footer span {
      margin-left: 5px;
    }

    /* Responsywność */
    @media (max-width: 768px) {
      h1 {
        font-size: 28px;
      }
      th, td {
        padding: 8px;
        font-size: 14px;
      }
      table {
        font-size: 14px;
      }
      footer {
        font-size: 12px;
      }
    }
    @media (max-width: 480px) {
      h1 {
        font-size: 22px;
      }
      th, td {
        padding: 6px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <h1 id="summary">DO ZAPŁATY: 0 zł</h1>

  <table id="tabela">
    <tr>
      <th>Miesiąc</th>
      <th>Termin płatności</th>
      <th>Kwota</th>
      <th>Status</th>
    </tr>
  </table>

 <footer>
  <p>© <span id="year"></span> Website designed by <strong>Marek Websites</strong> 🧠</p>
  <p style="font-size:12px; color:#bbb;">
    Strona automatycznie aktualizuje status wpłat na podstawie weryfikacji księgowej.
  </p>
  <div style="margin-top:10px;">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=https://github.com/pmarek02" alt="QR do płatności">
  </div>
</footer>

<script>
  document.getElementById("year").innerText = new Date().getFullYear();
</script>



  <script>
    document.getElementById("year").innerText = new Date().getFullYear();

    const miesiace = [
      {nazwa: "Styczeń", data: "2025-01-31", kwota: 1150},
      {nazwa: "Luty", data: "2025-02-28", kwota: 1150},
      {nazwa: "Marzec", data: "2025-03-31", kwota: 1150},
      {nazwa: "Kwiecień", data: "2025-04-30", kwota: 1150},
      {nazwa: "Maj", data: "2025-05-31", kwota: 1150},
      {nazwa: "Czerwiec", data: "2025-06-30", kwota: 1150},
      {nazwa: "Lipiec", data: "2025-07-31", kwota: 1150},
      {nazwa: "Sierpień", data: "2025-08-31", kwota: 1150},
      {nazwa: "Wrzesień", data: "2025-09-30", kwota: 1150},
      {nazwa: "Październik", data: "2025-10-31", kwota: 1150},
      {nazwa: "Listopad", data: "2025-11-30", kwota: 1150},
      {nazwa: "Grudzień", data: "2025-12-31", kwota: 1150}
    ];

    const wplaty = 400 + 400 + 2500 + 100 + 2000; // suma wszystkich wpłat
    let pozostalaKwota = wplaty;
    const dzis = new Date();
    let sumaDoZaplaty = 0;

    const tabela = document.getElementById("tabela");

    miesiace.forEach(m => {
      const tr = document.createElement("tr");
      const termin = new Date(m.data);
      const tdMiesiac = document.createElement("td");
      tdMiesiac.innerText = m.nazwa;
      const tdTermin = document.createElement("td");
      tdTermin.innerText = termin.toLocaleDateString();
      const tdKwota = document.createElement("td");
      tdKwota.innerText = m.kwota + " zł";
      const tdStatus = document.createElement("td");

      if (dzis >= termin) {
        if (pozostalaKwota >= m.kwota) {
          tdStatus.innerText = "Zapłacone (100%)";
          tr.className = "paid";
          pozostalaKwota -= m.kwota;
        } else if (pozostalaKwota > 0) {
          let procent = Math.floor((pozostalaKwota / m.kwota) * 100);
          tdStatus.innerText = `Częściowo opłacone (${procent}%)`;
          tr.className = "unpaid";
          sumaDoZaplaty += m.kwota - pozostalaKwota;
          pozostalaKwota = 0;
        } else {
          tdStatus.innerText = `Brak wpłaty`;
          tr.className = "unpaid";
          sumaDoZaplaty += m.kwota;
        }
      } else {
        tdStatus.innerText = "Termin jeszcze nie minął";
        tr.className = "pending";
      }

      tr.appendChild(tdMiesiac);
      tr.appendChild(tdTermin);
      tr.appendChild(tdKwota);
      tr.appendChild(tdStatus);
      tabela.appendChild(tr);
    });

    document.getElementById("summary").innerText = `DO ZAPŁATY: ${sumaDoZaplaty} zł`;
  </script>

</body>
</html>
